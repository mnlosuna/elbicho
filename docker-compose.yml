services:

  db:
    image: postgres:15-alpine 
    container_name: osunadb_container
    restart: always
    environment:
      POSTGRES_USER: osuna
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: osunadb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 

volumes:
  postgres_data:
